stages:
  strux_ingest:
    cmd: python -m cnbr strux-ingest --config configs/data/strux.yaml
    deps:
      - configs/data/strux.yaml
      - data/curated/company_universe-2026-09-05.parquet
      - src/cnbr/config.py
      - src/cnbr/sources/strux.py
    outs:
      - data/raw/strux
      - data/interim/strux-consumer-staples-2026-09-05.parquet
      - data/interim/strux-consumer-staples-2026-09-05.manifest.json
  sec_filing_index:
    cmd: python -m cnbr sec-filing-index --config configs/data/sec_filing_index.yaml
    deps:
      - configs/data/sec_filing_index.yaml
      - data/raw/sec/feasibility-2026-09-05
      - src/cnbr/config.py
      - src/cnbr/financials/filing_index.py
    outs:
      - data/curated/sec_filing_index-2017-2024.parquet
      - reports/tables/sec_filing_index-2017-2024.json
  sec_coverage:
    cmd: python -m cnbr sec-coverage --config configs/data/sec_concept_coverage.yaml
    deps:
      - configs/data/sec_concept_coverage.yaml
      - data/raw/sec/feasibility-2026-09-05
      - src/cnbr/config.py
      - src/cnbr/financials
    outs:
      - reports/tables/sec_concept_coverage.csv
      - reports/tables/sec_concept_coverage.json
  sec_spike:
    cmd: python -m cnbr sec-spike --config configs/data/sec_feasibility_spike.yaml
    deps:
      - configs/data/sec_feasibility_spike.yaml
      - src/cnbr/config.py
      - src/cnbr/sources/sec.py
      - src/cnbr/sources/sec_acquisition.py
    outs:
      - data/raw/sec/feasibility-2026-09-05
      - data/raw/sec/feasibility-2026-09-05.manifest.json
  universe:
    cmd: python -m cnbr universe-build --config configs/data/consumer_staples_universe.yaml
    deps:
      - configs/data/consumer_staples_universe.yaml
      - src/cnbr/config.py
      - src/cnbr/registry
    outs:
      - data/raw/reference/sp500-constituents-2026-09-05.csv
      - data/curated/company_universe-2026-09-05.parquet
      - data/curated/company_universe-2026-09-05.manifest.json
  synthetic:
    cmd: python -m cnbr synthetic-run --config configs/data/synthetic.yaml
    deps:
      - configs/data/synthetic.yaml
      - src/cnbr/__main__.py
      - src/cnbr/cli.py
      - src/cnbr/config.py
      - src/cnbr/logging.py
      - src/cnbr/run_context.py
      - src/cnbr/synthetic.py
      - tests/fixtures/synthetic_calls.jsonl
    outs:
      - data/interim/synthetic_calls.parquet
      - data/features/synthetic_company_quarter.parquet
      - reports/tables/synthetic_summary.csv
      - reports/tables/synthetic_run.json
