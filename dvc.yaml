stages:
  narrative_features:
    cmd: python -m cnbr narrative-features --config configs/data/narrative.yaml
    deps:
      - configs/data/narrative.yaml
      - data/curated/utterances.parquet
      - data/curated/call_fiscal_mappings.parquet
      - src/cnbr/config.py
      - src/cnbr/transcripts/features.py
    outs:
      - data/features/narrative_structure_features.parquet
      - reports/tables/narrative_structure_features.json
  financial_features:
    cmd: python -m cnbr financial-features --config configs/data/features.yaml
    deps:
      - configs/data/features.yaml
      - data/curated/financial_values.parquet
      - src/cnbr/config.py
      - src/cnbr/financials/features.py
    outs:
      - data/features/financial_features.parquet
      - reports/tables/financial_features.json
  financial_normalize:
    cmd: python -m cnbr financial-normalize --config configs/data/values.yaml
    deps:
      - configs/data/values.yaml
      - data/interim/financial_fact_occurrences.parquet
      - data/curated/fiscal_periods.parquet
      - data/curated/sec_filing_index-2017-2024.parquet
      - data/curated/company_universe-2026-09-05.parquet
      - src/cnbr/config.py
      - src/cnbr/financials/normalize.py
    outs:
      - data/curated/financial_values.parquet
      - reports/tables/financial_normalization.json
  financial_extract:
    cmd: python -m cnbr financial-extract --config configs/data/facts.yaml
    deps:
      - configs/data/facts.yaml
      - data/curated/sec_filing_index-2017-2024.parquet
      - data/curated/company_universe-2026-09-05.parquet
      - data/raw/sec/feasibility-2026-09-05
      - src/cnbr/config.py
      - src/cnbr/financials/extract.py
    outs:
      - data/interim/financial_fact_occurrences.parquet
      - reports/tables/financial_fact_extraction.json
  fiscal_align:
    cmd: python -m cnbr fiscal-align --config configs/data/align.yaml
    deps:
      - configs/data/align.yaml
      - data/curated/sec_filing_index-2017-2024.parquet
      - data/curated/calls.parquet
      - data/curated/company_universe-2026-09-05.parquet
      - data/raw/sec/feasibility-2026-09-05
      - src/cnbr/config.py
      - src/cnbr/contracts/registry.py
      - src/cnbr/financials/alignment.py
    outs:
      - data/curated/fiscal_periods.parquet
      - data/curated/call_fiscal_mappings.parquet
      - reports/tables/fiscal_alignment.json
  transcript_normalize:
    cmd: python -m cnbr transcript-normalize --config configs/data/norm.yaml
    deps:
      - configs/data/norm.yaml
      - data/interim/strux-consumer-staples-2026-09-05.parquet
      - data/curated/company_universe-2026-09-05.parquet
      - src/cnbr/config.py
      - src/cnbr/transcripts/normalize.py
    outs:
      - data/curated/calls.parquet
      - data/curated/participants.parquet
      - data/curated/utterances.parquet
      - data/curated/transcript_normalization.manifest.json
  transcript_audit:
    cmd: python -m cnbr transcript-audit --config configs/data/audit.yaml
    deps:
      - configs/data/audit.yaml
      - data/interim/strux-consumer-staples-2026-09-05.parquet
      - src/cnbr/config.py
      - src/cnbr/transcripts/audit.py
    outs:
      - reports/tables/strux_call_quality.csv
      - reports/tables/strux_company_coverage.csv
      - reports/tables/strux_transcript_audit.json
  strux_ingest:
    cmd: python -m cnbr strux-ingest --config configs/data/strux.yaml
    deps:
      - configs/data/strux.yaml
      - data/curated/company_universe-2026-09-05.parquet
      - src/cnbr/config.py
      - src/cnbr/sources/strux.py
    outs:
      - data/raw/strux
      - data/interim/strux-consumer-staples-2026-09-05.parquet
      - data/interim/strux-consumer-staples-2026-09-05.manifest.json
  sec_filing_index:
    cmd: python -m cnbr sec-filing-index --config configs/data/sec_filing_index.yaml
    deps:
      - configs/data/sec_filing_index.yaml
      - data/raw/sec/feasibility-2026-09-05
      - src/cnbr/config.py
      - src/cnbr/financials/filing_index.py
    outs:
      - data/curated/sec_filing_index-2017-2024.parquet
      - reports/tables/sec_filing_index-2017-2024.json
  sec_coverage:
    cmd: python -m cnbr sec-coverage --config configs/data/sec_concept_coverage.yaml
    deps:
      - configs/data/sec_concept_coverage.yaml
      - data/raw/sec/feasibility-2026-09-05
      - src/cnbr/config.py
      - src/cnbr/financials/coverage.py
    outs:
      - reports/tables/sec_concept_coverage.csv
      - reports/tables/sec_concept_coverage.json
  sec_spike:
    cmd: python -m cnbr sec-spike --config configs/data/sec_feasibility_spike.yaml
    deps:
      - configs/data/sec_feasibility_spike.yaml
      - src/cnbr/config.py
      - src/cnbr/sources/sec.py
      - src/cnbr/sources/sec_acquisition.py
    outs:
      - data/raw/sec/feasibility-2026-09-05
      - data/raw/sec/feasibility-2026-09-05.manifest.json
  universe:
    cmd: python -m cnbr universe-build --config configs/data/consumer_staples_universe.yaml
    deps:
      - configs/data/consumer_staples_universe.yaml
      - src/cnbr/config.py
      - src/cnbr/registry
    outs:
      - data/raw/reference/sp500-constituents-2026-09-05.csv
      - data/curated/company_universe-2026-09-05.parquet
      - data/curated/company_universe-2026-09-05.manifest.json
  synthetic:
    cmd: python -m cnbr synthetic-run --config configs/data/synthetic.yaml
    deps:
      - configs/data/synthetic.yaml
      - src/cnbr/__main__.py
      - src/cnbr/cli.py
      - src/cnbr/config.py
      - src/cnbr/logging.py
      - src/cnbr/run_context.py
      - src/cnbr/synthetic.py
      - tests/fixtures/synthetic_calls.jsonl
    outs:
      - data/interim/synthetic_calls.parquet
      - data/features/synthetic_company_quarter.parquet
      - reports/tables/synthetic_summary.csv
      - reports/tables/synthetic_run.json
