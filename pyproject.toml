[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "corporate-narrative-business-reality"
version = "0.1.0"
description = "NLP and panel-data research on earnings-call narrative and business fundamentals."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "LicenseRef-Proprietary"
authors = [{ name = "Project contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "polars>=1.0,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6,<7",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
pipeline = ["dvc>=3.60,<4"]
analysis = [
  "linearmodels>=6,<8",
  "mlflow>=3,<4",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
]
nlp = [
  "datasets>=3,<5",
  "sentence-transformers>=3,<6",
  "torch>=2.4,<3",
  "transformers>=4.45,<6",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5,<2",
  "hypothesis>=6.110,<7",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<5",
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]
docs = ["mkdocs-material>=9.5,<10"]

[project.scripts]
cnbr = "cnbr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cnbr"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Polars exposes intentionally broad expression overloads that Pyright reports as
# partially unknown even when concrete DataFrame values are checked correctly.
reportUnknownMemberType = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=cnbr --cov-report=term-missing"
testpaths = ["tests"]
markers = ["integration: tests crossing more than one module boundary"]

[tool.coverage.run]
branch = true
source = ["cnbr"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
